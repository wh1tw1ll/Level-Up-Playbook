<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Up Playbook</title>
<script>
(function(){
  var t;try{t=localStorage.getItem('lu_theme')}catch(e){}
  if(!t) t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#184655;--teal-light:#E8F1EF;--teal-mid:#2D6B7F;
  --sage:#8BED1C6;--charcoal:#181818;--cool:#E6E7E8;
  --bg:#F8F8F6;--card:#fff;--border:#E2E2DE;--muted:#717168;
  --topbar-bg:#184655;--radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#0e1419;--card:#1a232b;--border:#2a3540;--muted:#8a98a5;
  --charcoal:#e8ecef;--cool:#2a3540;--teal-light:#1d2d35;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--charcoal);min-height:100vh;font-size:15px;line-height:1.6;transition:background .2s,color .2s}

/* TOPBAR */
.sticky-header{position:sticky;top:0;z-index:200;width:100%}
.topbar{background:var(--topbar-bg);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo svg{height:28px}
.search-wrap{flex:1;position:relative;max-width:600px}
.search-input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 14px;color:#fff;font-size:14px;font-family:inherit;outline:none}
.search-input::placeholder{color:rgba(255,255,255,.55)}
.search-input:focus{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.topbar-btn{background:rgba(255,255,255,.1);border:none;color:#fff;padding:7px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;display:flex;align-items:center;gap:6px;transition:background .15s}
.topbar-btn:hover{background:rgba(255,255,255,.18)}
.topbar-btn.primary{background:#fff;color:var(--teal)}
.topbar-btn.primary:hover{background:#f0f0ed}
.topbar-user{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.85)}

/* NAV TABS */
.nav{background:var(--topbar-bg);padding:0 24px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:4px}
.nav-tab{display:flex;align-items:center;gap:6px;padding:11px 18px;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:3px solid transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.05em}
.nav-tab:hover{color:rgba(255,255,255,.9)}
.nav-tab.active{color:#fff;border-bottom-color:var(--sage)}

/* MAIN VIEWS */
.view{display:none;padding:40px 24px;max-width:1400px;margin:0 auto}
.view.active{display:block}
.view-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.back-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0;font-family:inherit}
.back-btn:hover{color:var(--charcoal)}
.view-title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--charcoal)}

/* HOME GRID */
.home-greeting{font-size:32px;font-weight:700;color:var(--charcoal);margin-bottom:6px}
.home-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.home-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .15s;position:relative;text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column;min-height:200px}
.home-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--teal)}
.home-card-icon{font-size:24px;margin-bottom:12px}
.home-card-title{font-size:16px;font-weight:700;color:var(--charcoal);margin-bottom:6px}
.home-card-desc{font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.home-card-meta{font-size:11px;color:var(--muted);margin-top:12px;font-weight:500}
.home-card-link{color:var(--teal);font-size:13px;font-weight:600;margin-top:12px}
.home-card.accent{background:var(--teal-light);border-color:var(--teal)}
.home-card-badge{position:absolute;top:14px;right:14px;background:var(--sage);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}

/* PLAYBOOK */
.shell{display:grid;grid-template-columns:280px 1fr;gap:24px;max-width:1400px;margin:0 auto;padding:24px}
.sidebar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;height:fit-content;position:sticky;top:96px}
.sidebar-section{margin-bottom:20px}
.sidebar-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.phase-pill{display:inline-block;padding:5px 11px;margin:2px 4px 2px 0;border-radius:14px;font-size:12px;background:var(--cool);color:var(--charcoal);cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.phase-pill:hover{background:var(--teal-light)}
.phase-pill.active{background:var(--teal);color:#fff}
.topic-chip{display:inline-block;padding:4px 9px;margin:2px;border-radius:12px;font-size:11px;background:transparent;color:var(--muted);cursor:pointer;border:1px solid var(--border);font-family:inherit}
.topic-chip:hover{color:var(--charcoal);border-color:var(--charcoal)}
.topic-chip.active{background:var(--teal);color:#fff;border-color:var(--teal)}

.content-area{min-height:400px}
.results-meta{font-size:12px;color:var(--muted);margin-bottom:16px}
.kb-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--charcoal);user-select:none;transition:background .15s}
.kb-group:hover{background:var(--teal-light)}
.kb-group-chevron{display:inline-block;transition:transform .15s;font-size:11px;color:var(--muted)}
.kb-group.collapsed .kb-group-chevron{transform:rotate(-90deg)}
.kb-group-title{flex-shrink:0}
.kb-group-desc{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;margin-left:8px}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;transition:box-shadow .15s}
.section-card:hover{box-shadow:var(--shadow)}
.section-card-header{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px}
.section-card-header:hover{background:var(--teal-light)}
.sec-badge{background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0}
.sec-title{font-size:14px;font-weight:600;color:var(--charcoal);margin-bottom:3px}
.sec-phases{display:flex;flex-wrap:wrap;gap:4px}
.sec-phase-tag{font-size:10px;padding:2px 8px;background:var(--cool);color:var(--muted);border-radius:10px}
.sec-chevron{color:var(--muted);font-size:12px;margin-left:auto}
.section-card-body{padding:0 18px 18px;border-top:1px solid var(--border);display:none}
.section-card.open .section-card-body{display:block}
.section-card-body p{font-size:13px;line-height:1.65;color:var(--charcoal);margin:12px 0}
.section-card-body ul{font-size:13px;line-height:1.7;color:var(--charcoal);padding-left:20px;margin:8px 0}
.section-card-body li{margin-bottom:4px}
.section-card-body h3{font-size:14px;font-weight:700;color:var(--charcoal);margin:16px 0 8px}

/* SHAREPOINT / EMAIL / CALENDAR PANELS */
.sp-search-row{display:flex;gap:8px;margin-bottom:16px}
.sp-search-input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--card);color:var(--charcoal);outline:none}
.sp-search-input:focus{border-color:var(--teal)}
.btn-primary{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary:hover{background:var(--teal-mid)}
.sp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;align-items:center}
.sp-chips-label{font-size:11px;color:var(--muted);font-weight:600;margin-right:4px}
.sp-chip{background:var(--card);border:1px solid var(--border);color:var(--charcoal);padding:5px 11px;border-radius:14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.sp-chip:hover{background:var(--teal-light);border-color:var(--teal);color:var(--teal)}
.file-result{display:block;padding:14px 16px;margin-bottom:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;text-decoration:none;color:inherit;transition:box-shadow .15s}
.file-result:hover{box-shadow:var(--shadow)}
.empty-state{padding:40px 24px;text-align:center;max-width:480px;margin:0 auto}
.empty-state-icon{font-size:36px;margin-bottom:12px}
.empty-state-title{font-size:18px;font-weight:700;color:var(--charcoal);margin-bottom:8px}
.empty-state-desc{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.5}
.signin-btn{background:#184655;color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px}
.signin-btn:hover{background:var(--teal-mid)}
.email-row{display:flex;flex-direction:column;padding:14px 16px;margin-bottom:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:box-shadow .15s}
.email-row:hover{box-shadow:var(--shadow)}
.email-row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.email-subject{font-weight:600;font-size:14px;color:var(--charcoal);flex:1}
.email-subject.unread::before{content:'• ';color:var(--teal);font-weight:700}
.email-date{font-size:11px;color:var(--muted);flex-shrink:0}
.email-from{font-size:12px;color:var(--muted);margin-bottom:4px}
.email-preview{font-size:12px;color:var(--muted);line-height:1.4}
.cal-date-header{font-size:13px;font-weight:700;color:var(--charcoal);margin:20px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.cal-date-header.today{color:var(--teal);border-bottom-color:var(--teal)}
.cal-event{display:flex;gap:14px;padding:12px 14px;margin-bottom:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;align-items:flex-start}
.cal-event.today{background:var(--teal-light)}
.cal-event-time{min-width:84px;font-size:12px;color:var(--muted);font-weight:600;padding-top:2px}
.cal-event-title{font-weight:600;font-size:14px;color:var(--charcoal);margin-bottom:3px}
.cal-event-loc{font-size:12px;color:var(--muted)}

/* AI CHAT FAB + DRAWER */
#fab{position:fixed;bottom:24px;right:24px;z-index:1001;background:var(--teal);color:#fff;border:none;border-radius:24px;padding:13px 22px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2);font-family:inherit;display:flex;align-items:center;gap:8px;transition:all .15s}
#fab:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.chat-drawer{position:fixed;bottom:88px;right:24px;width:400px;max-height:65vh;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:1001;display:none;flex-direction:column;overflow:hidden}
.chat-drawer.open{display:flex}
.chat-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--teal-light)}
.chat-header-title{font-size:14px;font-weight:700;color:var(--charcoal)}
.chat-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:0}
.chat-quicks{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:5px}
.chat-quick{background:var(--cool);border:none;border-radius:12px;padding:5px 11px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--charcoal)}
.chat-quick:hover{background:var(--teal-light)}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.chat-msg{max-width:85%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.5;word-wrap:break-word}
.chat-msg.user{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.chat-msg.ai{background:var(--cool);color:var(--charcoal);align-self:flex-start;border-bottom-left-radius:3px}
.chat-msg.ai.loading{color:var(--muted);font-style:italic;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.chat-input-row{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--charcoal);outline:none}
.chat-input:focus{border-color:var(--teal)}
.chat-send{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.chat-send:hover{background:var(--teal-mid)}
.chat-send:disabled{opacity:.5;cursor:not-allowed}

/* PHASE GUIDE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-dialog{background:var(--card);border-radius:12px;max-width:720px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:700;color:var(--charcoal)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.pg-phase{margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.pg-phase-header{padding:12px 16px;cursor:pointer;background:var(--card);display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.pg-phase-header:hover{background:var(--teal-light)}
.pg-phase-chevron{font-size:12px;color:var(--muted)}
.pg-phase-body{padding:14px 16px;border-top:1px solid var(--border);background:var(--bg);font-size:13px;color:var(--charcoal);line-height:1.6}
.pg-phase-body h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 6px}
.pg-phase-body ul{padding-left:20px;margin:6px 0}

/* MFP PANEL */
.mfp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.mfp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .15s}
.mfp-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--teal)}
.mfp-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mfp-icon{font-size:20px}
.mfp-card-title{font-size:15px;font-weight:700;color:var(--charcoal);flex:1}
.mfp-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--cool);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mfp-badge.red{background:#fce8e8;color:#c0392b}
.mfp-badge.warn{background:#fef4e0;color:#a05c00}
.mfp-card-summary{font-size:13px;color:var(--charcoal);line-height:1.55;margin-bottom:10px}
.mfp-card-bullets{font-size:12px;color:var(--muted);line-height:1.55}

/* DIAG */
#lu-diag{position:fixed;bottom:0;left:0;right:0;background:#0f2d1a;color:#4ade80;font-size:11px;font-family:monospace;padding:3px 12px;z-index:99999;display:flex;gap:12px;align-items:center}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:relative;top:0}
  .topbar{padding:10px 12px;gap:8px}
  .search-wrap{max-width:none}
}
</style>
</head>
<body>

<div class="sticky-header">
<header class="topbar">
  <a class="logo" href="#" onclick="setView('home');return false;" title="Home">
    <svg viewBox="60 190 700 100" xmlns="http://www.w3.org/2000/svg">
      <g fill="#fff"><path d="m265.9,207.31v43.5h35.59c0,8.47-6.87,15.34-15.34,15.34h-39.15v-58.85h18.9Z"/><path d="m303.38,207.31h18.9v43.5h51.7v15.34h-70.6v-58.85Z"/><path d="m440.71,266.16h-18.84v-58.85h18.84v58.85Z"/><path d="m538.61,207.31l-36.71,58.85h-21.36l-36.71-58.85h21.8l25.59,41.45,25.59-41.45h21.8Z"/><path d="m624.71,207.31v15.34h-51.7v9.17h46.05v14.08h-46.05v5.05h53.04v15.21h-71.37v-58.85h70.03Z"/><path d="m714.69,266.16l-21.54-21.54h-14.26v21.54h-18.9v-58.85h43.72c14.31,0,25.9,11.59,25.9,25.9,0,9.77-5.42,18.26-13.44,22.64l20.32,20.32h-21.8ZM678.89,230.59h16.82c4.67,0,8.47-3.79,8.47-8.47s-3.79-8.47-8.47-8.47h-16.82v16.94Z"/></g>
    </svg>
  </a>
  <div class="search-wrap">
    <input id="search-input" class="search-input" type="text" placeholder="Search the playbook..." oninput="applySearch(this.value)">
  </div>
  <button id="theme-btn" class="topbar-btn" onclick="toggleTheme()" title="Toggle theme">☀</button>
  <div id="auth-user-info" class="topbar-user" style="display:none">
    <span id="auth-user-name"></span>
    <button class="topbar-btn" onclick="signOut()">Sign out</button>
  </div>
  <button id="auth-signin-btn" class="topbar-btn primary" onclick="signInWithMicrosoft()">
    <svg width="14" height="14" viewBox="0 0 21 21"><rect width="10" height="10" fill="#F25022"/><rect x="11" width="10" height="10" fill="#7FBA00"/><rect y="11" width="10" height="10" fill="#00A4EF"/><rect x="11" y="11" width="10" height="10" fill="#FFB900"/></svg>
    Sign in
  </button>
</header>
<nav class="nav">
  <button class="nav-tab active" id="nav-home" onclick="setView('home')">Home</button>
  <button class="nav-tab" id="nav-playbook" onclick="setView('playbook')">Playbook</button>
  <button class="nav-tab" id="nav-projects" onclick="setView('projects')">Projects</button>
  <button class="nav-tab" id="nav-templates" onclick="setView('templates')">Templates</button>
  <button class="nav-tab" id="nav-actions" onclick="setView('actions')">Action Items</button>
</nav>
</div>

<!-- HOME VIEW -->
<div id="view-home" class="view active">
  <div class="home-greeting" id="home-greeting">Good morning</div>
  <div class="home-sub">Level Up Project Development — PM Playbook</div>
  <div class="home-grid">
    <button class="home-card accent" onclick="setView('playbook')">
      <div class="home-card-icon">📚</div>
      <div class="home-card-title">Playbook</div>
      <div class="home-card-desc">43 sections across 5 groups — methodology, controls, phase execution, and reference material.</div>
      <div class="home-card-link">Open Playbook →</div>
    </button>
    <button class="home-card" onclick="setView('projects')">
      <div class="home-card-icon">📂</div>
      <div class="home-card-title">Projects</div>
      <div class="home-card-desc">Active projects and dashboards. MFP Stadium currently active — Post-Opening Closeout.</div>
      <div class="home-card-badge" id="projects-badge">1 Active</div>
      <div class="home-card-link">Open Projects →</div>
    </button>
    <button class="home-card" onclick="setView('actions')">
      <div class="home-card-icon">✅</div>
      <div class="home-card-title">Action Items</div>
      <div class="home-card-desc">Track open action items across all projects.</div>
      <div class="home-card-link">View Action Items →</div>
    </button>
    <button class="home-card" onclick="setView('templates')">
      <div class="home-card-icon">📑</div>
      <div class="home-card-title">Templates</div>
      <div class="home-card-desc">10 branded Excel templates — risk register, budget tracker, change order log, and more.</div>
      <div class="home-card-link">Browse Templates →</div>
    </button>
    <button class="home-card" onclick="openPhaseGuide()">
      <div class="home-card-icon">📖</div>
      <div class="home-card-title">Phase Reading Guide</div>
      <div class="home-card-desc">Find which sections to read based on your current project phase.</div>
      <div class="home-card-link">Open Guide →</div>
    </button>
    <button class="home-card" onclick="openDecisionTree()">
      <div class="home-card-icon">🔀</div>
      <div class="home-card-title">What Do I Do?</div>
