      document.querySelector('.filters').style.display = 'none';
      document.querySelector('.source-chips').style.display = 'none';
      document.getElementById('prep-view').classList.add('active');
      loadPrepView();
      return;
    }

    // Show task view
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('task-list').style.display = '';
    document.querySelector('.filters').style.display = '';
    document.querySelector('.source-chips').style.display = '';
    document.getElementById('prep-view').classList.remove('active');
    currentProject = project;
    render();
  });

  // Search
  document.getElementById('search-input').addEventListener('input', function() {
    searchText = this.value;
    render();
  });

  // Status filter
  document.getElementById('status-filter').addEventListener('change', function() {
    currentStatus = this.value;
    render();
  });

  // Category filter
  document.getElementById('category-filter').addEventListener('change', function() {
    currentCategory = this.value;
    render();
  });

  // Owner filter
  document.getElementById('owner-filter').addEventListener('change', function() {
    currentOwner = this.value;
    render();
  });

  // Series filter
  document.getElementById('series-filter').addEventListener('change', function() {
    currentSeries = this.value;
    render();
  });

  // Source chips
  document.querySelectorAll('.source-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      document.querySelectorAll('.source-chip').forEach(c => c.classList.remove('active'));
      this.classList.add('active');
      currentSource = this.dataset.source;
      render();
    });
  });

  // Delegated dispatch click handler
  document.getElementById('task-list').addEventListener('click', function(e) {
    var btn = e.target.closest('.task-dispatch.dispatchable');
    if (!btn) return;
    if (btn.disabled) return;
    e.stopPropagation();
    var rowId = btn.dataset.rowId;
    var source = btn.dataset.source || 'project';
    var type = btn.dataset.type || 'DO';
    dispatchTask(btn, rowId, source, type);
  });

  // Initial load from cache then fetch
  try {
    const cached = localStorage.getItem('luci_tasks_cache');
    if (cached) {
      const data = JSON.parse(cached);
      allTasks = data.tasks || [];
      render();
      document.getElementById('task-list').classList.remove('loading');
      document.getElementById('updated-at').textContent = 'cached';
    }
  } catch(e) {}
  loadTasks();
  // ── PREP VIEW ──
  function loadPrepView() {
    const v = document.getElementById('prep-view');
    v.innerHTML = '<div class="prep-loading">Loading meeting prep...</div>';

    fetch('/api/prep')
      .then(r => {
        if (r.status === 401) throw new AuthRequiredError();
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        if (!data.events || data.events.length === 0) {
          v.innerHTML = '<div class="prep-empty">No upcoming meetings in the next 14 days.</div>';
          return;
        }
        renderPrepView(v, data.events);
      })
      .catch(err => {
        if (err instanceof AuthRequiredError) {
          v.innerHTML = '<div class="prep-error">' +
            'Calendar access requires Microsoft sign-in. ' +
            '<a href="/auth/login" class="prep-view-note-btn" style="text-decoration:none;display:inline-block;margin-top:8px">' +
            'Sign in with Microsoft</a></div>';
          return;
        }
        v.innerHTML = '<div class="prep-error">Failed to load: ' + escapeHtml(err.message) + '</div>';
      });
  }

  function AuthRequiredError() { this.name = 'AuthRequiredError'; }
  AuthRequiredError.prototype = new Error();

  function renderPrepView(container, events) {
      // Group events by day using full dateET (already Eastern Time, e.g. "Mon, Sep 22")
      const groups = {};

      for (const ev of events) {
        const day = ev.dateET || '';
        if (!day) continue;
        if (!groups[day]) groups[day] = [];
        groups[day].push(ev);
      }

      let html = '';
      const todayStr = new Date().toLocaleDateString('en-US', { timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric' });

      for (const [dayLabel, dayEvents] of Object.entries(groups)) {
        // Sort day keys chronologically — Today and Tomorrow first, then by date
        const isToday = dayLabel.startsWith('Today');
        const isTomorrow = dayLabel.startsWith('Tomorrow');
        let displayDay = dayLabel;
        if (!isToday && !isTomorrow) {
          // Extract just the date part for display
          const parts = dayLabel.split(',');
          if (parts.length >= 2) {
            // Show "Monday | Sep 22" — full weekday + numeric date
            const weekday = new Date(dayEvents[0].start?.dateTime || dayLabel)
              .toLocaleDateString('en-US', { timeZone: 'America/New_York', weekday: 'long' });
            displayDay = weekday + '  |  ' + parts.slice(1).join(',').trim();
          }
        }
        html += '<div class="prep-day-header' + (isToday ? ' today' : '') + '">' + escapeHtml(displayDay) + '</div>';
        html += '<div style="margin-bottom:6px">'; // Tighter group spacing

        for (const ev of dayEvents) {
          const hasNote = ev.hasGranolaNote;
          const isOneOff = !ev.isRecurring;
          const cardClass = 'prep-card' + (hasNote ? ' has-note' : '');
          const projectBadge = ev.project ? ' <span class="meta-tag project" style="font-size:10px;padding:0 4px">' + escapeHtml(ev.project) + '</span>' : '';
          const eventId = escapeHtml(ev.eventId || 'no-id');
          const detailId = 'prep-detail-' + eventId;

          // Card with tighter padding (6px vs 10px) — clickable to toggle detail
          html += '<div class="' + cardClass + '" style="padding:6px 10px;margin-bottom:6px;cursor:pointer" data-event-id="' + eventId + '">';
          html += '<div class="prep-header" style="margin-bottom:3px">';
          html += '  <div class="prep-title" style="font-size:14px">' + escapeHtml(ev.subject) + projectBadge + '</div>';
          html += '  <div class="prep-time" style="font-size:12px">' + escapeHtml(ev.timeET || '') + '</div>';
          html += '</div>';

          // Meta line (tighter)
          html += '<div class="prep-meta" style="margin-bottom:4px;font-size:11px">';
          if (ev.location) html += '<span class="prep-loc">' + escapeHtml(ev.location) + '</span>';
          if (ev.attendees && ev.attendees.length > 0) html += '<span style="color:var(--muted)">' + ev.attendees.length + ' attendees</span>';
          html += '</div>';

          if (hasNote) {
            // Granola summary (collapsed)
            if (ev.summaryPreview) {
              const truncated = ev.summaryPreview.length > 350;
              const display = truncated ? escapeHtml(ev.summaryPreview.substring(0, 350)) + '...' : escapeHtml(ev.summaryPreview);
              html += '<div class="prep-summary" id="prep-sum-' + eventId + '" style="max-height:150px">' + display + '</div>';
              if (truncated) {
                html += `<span class="prep-summary-expand" onclick="event.stopPropagation();document.getElementById('prep-sum-' ${eventId}).classList.toggle('expanded');this.textContent=this.textContent=='Show more'?'Show less':'Show more'">Show more</span>`;
              }
            }

            // Note age warning
            if (ev.granolaStaleDays && ev.granolaStaleDays > 30) {
              html += '<div style="font-size:11px;color:var(--warn);margin-top:2px">Note from ' + escapeHtml(ev.granolaNoteDate || '') + ' (' + ev.granolaStaleDays + ' days ago)</div>';
            }

            // Action items from Granola
            if (ev.actionItems && ev.actionItems.length > 0) {
              html += '<div class="prep-section-label" style="margin-top:6px;font-size:10px">Open Action Items</div>';
              for (const item of ev.actionItems) {
                html += '<div class="prep-action-item" style="font-size:12px;padding:2px 0">';
                html += '  <span class="prep-action-assignee" style="font-size:10px">' + escapeHtml(item.assignees[0]) + '</span>';
                html += '  <span class="prep-action-text">' + escapeHtml(item.text) + '</span>';
                html += '</div>';
              }
            }

            // View note button
            if (ev.granolaWebUrl) {
              html += '<a href="' + escapeHtml(ev.granolaWebUrl) + '" target="_blank" class="prep-view-note-btn" style="text-decoration:none;display:inline-block;font-size:10px">View in Granola</a>';
            }
          } else if (isOneOff) {
            // One-off: no note expected, no nag line
          } else if (ev.neverHadNote) {
            html += '<div class="prep-no-note" style="font-size:11px;padding:2px 0;font-style:italic;color:var(--muted)">No meeting notes for this series.</div>';
          }

          // ⬇ DETAIL SECTIONS (hidden by default, toggled on click) ⬇
                    html += '<div id="' + detailId + '" style="display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:8px">';

                    // Tab bar
                    html += '<div class="prep-detail-tabs">';
                    html += '  <button class="prep-detail-tab active" data-tab="agenda" onclick="event.stopPropagation();switchPrepTab(\'' + eventId + '\',\'agenda\')">AGENDA</button>';
                    html += '  <button class="prep-detail-tab" data-tab="notes" onclick="event.stopPropagation();switchPrepTab(\'' + eventId + '\',\'notes\')">NOTES</button>';
                    html += '</div>';

                    // AGENDA tab pane
                    html += '<div class="prep-tab-pane active" id="prep-tab-agenda-' + eventId + '">';

                    // OWED TO ME
                    if (ev.owedItems && ev.owedItems.length > 0) {
                      html += '<div class="prep-section-label" style="margin-top:6px;font-size:10px">OWED TO ME</div>';
                      const ownerGroups = {};
                      for (const item of ev.owedItems) {
                        const key = item.owner || 'Unassigned';
                        if (!ownerGroups[key]) ownerGroups[key] = [];
                        ownerGroups[key].push(item);
                      }
                      for (const [owner, items] of Object.entries(ownerGroups)) {
                        const ownerDisplay = owner === 'Unassigned' ? '---' : owner;
                        html += '<div style="margin:2px 0">';
                        html += '  <span style="font-size:11px;font-weight:500;color:var(--accent)">' + escapeHtml(ownerDisplay) + '</span>';
                        for (const item of items) {
                          const dueLabel = item.dueDate ? ' | due ' + item.dueDate : '';
                          html += '  <div style="font-size:12px;padding:1px 0 1px 12px;color:var(--fg)">' + escapeHtml(item.actionItem) + (dueLabel ? '<span style="color:var(--muted);font-size:11px">' + dueLabel + '</span>' : '') + '</div>';
                        }
                        html += '</div>';
                      }
                    }

                    // WHAT I OWE
                    if (ev.whitneyItems && ev.whitneyItems.length > 0) {
                      html += '<div class="prep-section-label" style="margin-top:6px;font-size:10px">WHAT I OWE</div>';
                      for (const item of ev.whitneyItems) {
                        const dueLabel = item.dueDate ? ' | due ' + item.dueDate : '';
                        html += '<div style="font-size:12px;padding:1px 0;color:var(--fg)">' + escapeHtml(item.actionItem) + (dueLabel ? '<span style="color:var(--muted);font-size:11px">' + dueLabel + '</span>' : '') + '</div>';
                      }
                    }

                    // CARRIED OVER
                    if (ev.pastNotes && ev.pastNotes.length > 0) {
                      const allSeriesItems = (ev.owedItems || []).concat(ev.whitneyItems || []);
                      if (allSeriesItems.length > 0) {
                      const carriedItems = [];
                      for (const pn of ev.pastNotes) {
                        if (!pn.actionItems) continue;
                        for (const ai of pn.actionItems) {
                          const stillOpen = allSeriesItems.some(oi =>
                            oi.actionItem.toLowerCase().includes(ai.text.toLowerCase().substring(0, 30))
                          );
                          if (stillOpen) {
                            const existing = carriedItems.find(c => c.text === ai.text);
                            if (!existing) {
                              carriedItems.push({ text: ai.text, assignee: ai.assignees[0], firstSeen: pn.date });
                            }
                          }
                        }
                      }
                      if (carriedItems.length > 0) {
                        html += '<div class="prep-section-label" style="margin-top:6px;font-size:10px">CARRIED OVER</div>';
                        for (const ci of carriedItems) {
                          html += '<div class="prep-action-item" style="font-size:12px;padding:2px 0">';
                          html += '  <span class="prep-action-assignee" style="font-size:10px">' + escapeHtml(ci.assignee) + '</span>';
                          html += '  <span class="prep-action-text">' + escapeHtml(ci.text) + '</span>';
                          html += '</div>';
                        }
                      }
                      }
                    }

                    // COPY & PRINT button
                    html += '<button class="prep-view-note-btn" style="margin-top:6px" onclick="event.stopPropagation();copyPrepPrint(\'' + eventId + '\', \'' + escapeHtml(ev.subject) + '\', \'' + escapeHtml(ev.project) + '\')">Copy & Print</button>';

                    html += '</div>'; // end AGENDA pane

                    // NOTES tab pane
                    html += '<div class="prep-tab-pane" id="prep-tab-notes-' + eventId + '">';
                    if (ev.summaryMarkdown) {
                      html += '<div class="prep-notes-content">' + escapeHtml(ev.summaryMarkdown) + '</div>';
                      if (ev.granolaWebUrl) {
                        html += '<a href="' + escapeHtml(ev.granolaWebUrl) + '" target="_blank" class="prep-view-note-btn" style="text-decoration:none;display:inline-block;font-size:10px;margin-top:4px">View in Granola</a>';
                      }
                    } else {
                      html += '<div class="prep-no-note" style="font-size:11px;padding:2px 0;font-style:italic;color:var(--muted)">No meeting notes for this meeting.</div>';
                    }
                    html += '</div>'; // end NOTES pane

                    html += '</div>'; // end detail section
                    html += '</div>'; // end card
        }
        html += '</div>';
      }

      container.innerHTML = html;
    }
  // Auto-refresh every 60 seconds, skip while editing
  setInterval(function() {
    if (hasActiveInput) return; // Don't overwrite what the user is typing
    const statusEl = document.getElementById('refresh-status');
    statusEl.textContent = '⟳';
    fetch('/api/tasks')
      .then(r => r.json())
      .then(data => {
        allTasks = data.tasks || [];
        // Refresh filter dropdowns
        const owners = new Set(allTasks.map(t => t.owner).filter(Boolean));
        const sel = document.getElementById('owner-filter');
        const curOwner = sel.value;
        sel.innerHTML = '<option value="">All Owners</option>';
        [...owners].sort().forEach(o => {
          sel.innerHTML += '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + '</option>';
        });
        if (curOwner) sel.value = curOwner;
        const categories = new Set(allTasks.map(t => t.category).filter(Boolean));
        const catSel = document.getElementById('category-filter');
        const curCat = catSel.value;
        catSel.innerHTML = '<option value="">All Categories</option>';
        [...categories].sort().forEach(c => {
          catSel.innerHTML += '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
        });
        if (curCat) catSel.value = curCat;
        render();
        document.getElementById('task-list').classList.remove('loading');
        document.getElementById('updated-at').textContent = new Date().toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
        statusEl.textContent = '';
        try { localStorage.setItem('luci_tasks_cache', JSON.stringify(data)); } catch(e) {}
      })
      .catch(function() { statusEl.textContent = ''; });
  }, 60000);

  // Delegated click handler for prep cards (replaces inline onclick — avoids escaping issues)
  document.addEventListener('click', function(e) {
    var card = e.target.closest('[data-event-id]');
    if (!card) return;
    var eventId = card.getAttribute('data-event-id');
    if (eventId) togglePrepDetail(eventId);
  });
});
</script>
</body>
</html>
